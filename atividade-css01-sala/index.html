


<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição em Curso - Dev Start</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="secao cabecalho-principal">
        <h1>Dev Start | Plataforma de Cursos</h1>
        <p>Preencha o formulário abaixo para garantir sua vaga no curso desejado.</p>
    </header>

    <main class="secao">
        <form class="formulario">
            <div class="grupo-campo">
                <label for="nome" class="campo-obrigatorio">Nome Completo:</label>
                <input type="text" id="nome" name="nome" class="campo-texto" placeholder="Digite seu nome completo" required>
            </div>

            <div class="grupo-campo">
                <label for="email" class="campo-obrigatorio">E-mail:</label>
                <input type="email" id="email" name="email" class="campo-texto" placeholder="seuemail@exemplo.com" required>
            </div>

            <div class="grupo-campo">
                <label for="data-nascimento">Data de Nascimento:</label>
                <input type="date" id="data-nascimento" name="data-nascimento" class="campo-texto">
            </div>

            <div class="grupo-campo">
                <label for="curso" class="campo-obrigatorio">Selecione o Curso:</label>
                <select id="curso" name="curso" class="campo-texto" required>
                    <option value="">-- Escolha uma opção --</option>
                    <option value="informatica">Informática Básica</option>
                    <option value="desenvolvimento-web">Desenvolvimento Web (HTML/CSS)</option>
                    <option value="python">Introdução à Programação com Python</option>
                </select>
            </div>

            <div class="grupo-campo">
                <label>Turno de Preferência:</label>
                <div class="grupo-opcoes">
                    <label><input type="radio" name="turno" value="manha" checked> Manhã</label>
                    <label><input type="radio" name="turno" value="tarde"> Tarde</label>
                    <label><input type="radio" name="turno" value="noite"> Noite</label>
                </div>
            </div>

            <div class="grupo-campo">
                <label for="comentario">Motivação / Observações:</label>
                <textarea id="comentario" name="comentario" class="campo-texto" placeholder="Conte-nos por que deseja fazer este curso..."></textarea>
            </div>

            <div class="grupo-campo opcao-checkbox">
                <label>
                    <input type="checkbox" id="termos" name="termos" required>
                    Aceito os termos de uso e condições de inscrição.
                </label>
            </div>

            <button type="submit" class="botao-principal">Realizar Inscrição</button>
        </form>
    </main>

    <footer class="rodape">
        <p>Integrantes: Aluno vinicius alexandre & Aluno arthur calado | Data: 2026 | Disciplina: pweb</p>
         <p><a href="../index.html">← Voltar para a página principal</a></p>
    </footer>

</body>
</html>
