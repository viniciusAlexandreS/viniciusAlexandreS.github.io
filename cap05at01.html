<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Formulário de Contato</title>
</head>
<body>

    <h1>Formulário de Contato</h1>

    <form action="https://httpbin.org/get" method="get">
        <label for="nome">Nome completo:</label><br>
        <input type="text" id="nome" name="nome"/><br><br>

        <label for="email">E-mail:</label><br>
        <input type="email" id="email" name="email" /><br><br>

         <label for="assunto">Assunto</label><br>
         <input type="text" id="assunto" name="assunto"/><br><br>

         <label for="mensagem">Enviar mensagem:</label><br>
         <textarea id="mensagem" name="mensagem" rows="5" cols="30" required></textarea><br><br>


     
         
    </form>

    <p>
        Após enviar o formulário, observe que os dados preenchidos aparecem na URL
        e também na resposta JSON exibida pelo httpbin, dentro do objeto <code>args</code>.
    </p>
<header>
            <h1>formulario de contato</h1>
            <p><a href="../index.html">← Voltar para a página principal</a></p>
        </header>
</body>
</html>
